name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend
        working-directory: VibeXBackend
        run: |
          ./mvnw -B -DskipTests=true package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        working-directory: VibeXFrontend
        run: |
          npm ci
          npm run build

      - name: Upload artifact (frontend)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: VibeXFrontend/dist
